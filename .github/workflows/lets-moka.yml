name: Let's Moka CI

on:
  push:
    branches: ['**']
    paths:
      - 'lets-moka/**'
      - '.github/workflows/lets-moka.yml'
  pull_request:
    paths:
      - 'lets-moka/**'
      - '.github/workflows/lets-moka.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: lets-moka

jobs:
  quality:
    name: Let's Moka quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: lets-moka/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build standalone binary
        run: go build -o lets-moka ./cmd/lets-moka
